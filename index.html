<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Math Bubble Pop Quiz</title>
    <style>
        :root{--accent:#f97316;--accent-dark:#c2410c;--bg-start:#fff7ed;--bg-end:#fffbf5;--correct:#0f9d58;--wrong:#c62828;--timer:#2563eb}
        *{box-sizing:border-box;font-family:"Segoe UI",Roboto,"Noto Sans",sans-serif}
        body{margin:0;min-height:100vh;background:radial-gradient(circle at top,var(--bg-start),var(--bg-end));display:flex;align-items:center;justify-content:center;padding:20px}
        .game{width:min(980px,100%);background:#fff;border-radius:24px;padding:24px 28px;box-shadow:0 25px 60px rgba(249,115,22,.12);display:flex;flex-direction:column;gap:14px}
        .header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
        .title{font-size:20px;font-weight:700;color:#1f2937}
        .meta{display:flex;gap:12px;align-items:center}
        .progress{font-weight:600;color:#475569}
        .timer-wrap{display:flex;align-items:center;gap:8px}
        .timer-bar{width:120px;height:10px;background:#f1f5f9;border-radius:999px;overflow:hidden}
        .timer-fill{height:100%;width:100%;background:var(--timer);transform-origin:left;transition:width .2s linear}
        .timer-value{min-width:36px;font-weight:700;color:#0f172a;text-align:center}
        .question{font-size:18px;font-weight:600;background:#fff4eb;border-radius:14px;padding:12px 14px;color:#9a3412;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
        .bubble-zone{position:relative;min-height:360px;border-radius:18px;background:linear-gradient(135deg,#fffdf7,#fff5e9);overflow:hidden;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;padding:18px}
        .bubble{width:120px;height:120px;border-radius:50%;background:#fff;box-shadow:0 15px 30px rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:800;color:#0f172a;cursor:pointer;transition:transform .18s,box-shadow .18s;animation:float 6s ease-in-out infinite;position:relative;user-select:none;border:none}
        .bubble::after{content:"";position:absolute;top:14px;left:28px;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.85);filter:blur(1px)}
        .bubble:hover{transform:translateY(-6px) scale(1.03);box-shadow:0 20px 36px rgba(0,0,0,.12)}
        .bubble.correct{background:var(--correct);color:#fff}
        .bubble.wrong{background:var(--wrong);color:#fff}
        @keyframes float{0%{transform:translateY(0)}50%{transform:translateY(-16px)}100%{transform:translateY(0)}}
        .message{min-height:36px;font-size:16px;font-weight:600;color:#1d4ed8}
        .controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
        button{background:var(--accent);color:#fff;border:none;border-radius:12px;padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 10px 20px rgba(249,115,22,.18);transition:transform .12s}
        button:active{transform:scale(.98)}
        button.secondary{background:#fff;color:var(--accent-dark);border:2px solid rgba(249,115,22,.18);box-shadow:none}
        select{padding:8px;border-radius:10px;border:1px solid #e6e6e6;font-weight:600}
        .hidden{display:none}
        @media(max-width:640px){.bubble{width:92px;height:92px;font-size:30px}}
    </style>
</head>

    <div class="game">
        <div class="header">
            <div class="title">Math Bubble Pop Quiz</div>
            <div class="meta">

                    <div class="timer-bar">

                    </div>
                    <div id="timerValue" class="timer-value">--</div>
                </div>
            </div>

                    <option value="custom">Custom</option>
                </select>

            </label>
            <label style="display:flex;align-items:center;gap:8px;font-weight:600;color:#475569">

                    <option value="8">8 choices</option>
                    <option value="10">10 choices</option>
                    <option value="custom">Custom</option>
                </select>
                <input id="customChoices" type="number" min="2" max="20" placeholder="Choices" style="width:80px;display:none;padding:6px;border-radius:8px;border:1px solid #ccc;font-weight:600"/>
            </label>
            <label style="display:flex;align-items:center;gap:8px;font-weight:600;color:#475569">
                <select id="roundSelect">

                    <option value="10" selected>10 rounds</option>
                    <option value="15">15 rounds</option>
                    <option value="20">20 rounds</option>
                    <option value="25">25 rounds</option>
                    <option value="custom">Custom</option>

            </label>
        </div>
    </div>

        let MAX_ROUNDS=10,BUBBLE_COUNT=6;
        const progressEl=document.getElementById("progress"),
            questionEl=document.getElementById("question"),
            bubbleZone=document.getElementById("bubbleZone"),
            messageEl=document.getElementById("message"),
            startBtn=document.getElementById("startBtn"),
            resetBtn=document.getElementById("resetBtn"),
            timerFill=document.getElementById("timerFill"),
            timerValue=document.getElementById("timerValue"),
            timeSelect=document.getElementById("timeSelect"),
            customTime=document.getElementById("customTime"),
            choiceSelect=document.getElementById("choiceSelect"),
            roundSelect=document.getElementById("roundSelect"),
            customChoices=document.getElementById("customChoices"),
            customRounds=document.getElementById("customRounds");
        
        let round=0,score=0,currentPair=null,awaitingAnswer=!1,timerInterval=null,remaining=0,roundTime=8;

        function rand(l){return l[Math.floor(Math.random()*l.length)]}
        function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

        function determineRoundTime(){let c;if(timeSelect.value==="custom"){c=parseInt(customTime.value,10);if(!c||c<1)c=8}else c=parseInt(timeSelect.value,10)||8;roundTime=c}

        function determineBubbleCount(){if(choiceSelect.value==="custom"){let c=parseInt(customChoices.value,10);if(!c||c<2)c=6;c=Math.min(c,MASTER_PAIRS.length);BUBBLE_COUNT=c}else BUBBLE_COUNT=parseInt(choiceSelect.value,10)||6}

        function determineMaxRounds(){if(roundSelect.value==="custom"){let c=parseInt(customRounds.value,10);if(!c||c<1)c=10;MAX_ROUNDS=c}else MAX_ROUNDS=parseInt(roundSelect.value,10)||10;progressEl.textContent=`Round 0 / ${MAX_ROUNDS} · Score 0`}

        function startGame(){round=0;score=0;startBtn.classList.add("hidden");resetBtn.classList.remove("hidden");messageEl.textContent="";determineRoundTime();determineBubbleCount();determineMaxRounds();nextRound()}

        function resetGame(){stopTimer();round=0;score=0;currentPair=null;awaitingAnswer=!1;bubbleZone.innerHTML="";progressEl.textContent=`Round 0 / ${MAX_ROUNDS} · Score 0`;questionEl.textContent="Tap “Start Game” to begin. You’ll see floating answers—pop the correct one!";messageEl.textContent="";timerFill.style.width="100%";timerValue.textContent="--";startBtn.classList.remove("hidden");resetBtn.classList.add("hidden");shuffle(MASTER_PAIRS)}

        function endGame(){stopTimer();questionEl.innerHTML=`All done! You popped ${score} out of ${MAX_ROUNDS} correctly.`;messageEl.textContent=score>=Math.ceil(MAX_ROUNDS*0.7)?"Fantastic work! You’re a pro!":"Good run! Replay to push that score higher.";bubbleZone.innerHTML=""}

        function stopTimer(){clearInterval(timerInterval);timerInterval=null}

        function startTimer(cb){remaining=roundTime;timerValue.textContent=remaining;timerFill.style.width="100%";timerInterval=setInterval(()=>{remaining--;timerValue.textContent=remaining;timerFill.style.width=(remaining/roundTime)*100+"%";if(remaining<=0){stopTimer();cb()}},1000)}

        function nextRound(){round++;if(round>MAX_ROUNDS){endGame();return}progressEl.textContent=`Round ${round} / ${MAX_ROUNDS} · Score ${score}`;currentPair=rand(MASTER_PAIRS);questionEl.textContent=`Find the sum: ${currentPair.left}`;renderBubbles();awaitingAnswer=!0;startTimer(()=>{awaitingAnswer=!1;messageEl.textContent="Time up!";setTimeout(nextRound,1000)})}

        // RENDER BUBBLES WITH IMPROVED DISTRACTOR LOGIC
        function renderBubbles(){
            bubbleZone.innerHTML="";
            let correct = parseInt(currentPair.right, 10);
            let answers = [correct];
            
            // Extract the numbers from the question string (e.g., "34 + 75")
            const parts = currentPair.left.split('+').map(s => parseInt(s.trim()));
            if (parts.length === 2) {
                const num1 = parts[0];
                const num2 = parts[1];
                
                // Helper function to check if an answer is valid and unique
                const addFakeAnswer = (fake) => {
                    if (fake !== correct && fake > 0 && !answers.includes(fake)) {
                        answers.push(fake);
                        return true;
                    }
                    return false;
                };

                // Strategy 1: Create a distractor by adding digits without carry-over (most common error)
                const unitsSum = (num1 % 10) + (num2 % 10);
                const tensSum = Math.floor(num1 / 10) + Math.floor(num2 / 10);
                
                let fake1 = tensSum * 10 + unitsSum; 
                addFakeAnswer(fake1); 

                // Strategy 2: Off-by-10, 20, or 30 (common mental math errors)
                const errorOffsets = [-10, 10, -20, 20, -30, 30];
                shuffle(errorOffsets);

                for (let offset of errorOffsets) {
                    if (answers.length >= BUBBLE_COUNT) break;
                    addFakeAnswer(correct + offset);
                }

                // Strategy 3: Off-by-9, 11, 19, 21 (near ten errors)
                const nearTenOffsets = [-9, 9, -11, 11];
                shuffle(nearTenOffsets);

                for (let offset of nearTenOffsets) {
                    if (answers.length >= BUBBLE_COUNT) break;
                    addFakeAnswer(correct + offset);
                }

                // Strategy 4: Fallback to the original small random deviation if needed
                while(answers.length < BUBBLE_COUNT){
                    // Random number from -15 to 15 (excluding -10, -9, 9, 10, etc., already tried)
                    let randomOffset = Math.floor(Math.random() * 31) - 15;
                    addFakeAnswer(correct + randomOffset);
                }
            } else {
                // If parsing fails, fall back to the original simple random deviation
                while(answers.length < BUBBLE_COUNT){
                    let fake=correct+Math.floor(Math.random()*20)-10; 
                    addFakeAnswer(fake);
                }
            }

            while(answers.length > BUBBLE_COUNT) answers.pop();

            shuffle(answers);
            
            answers.forEach(a => {
                let b = document.createElement("button");
                b.className = "bubble";
                b.textContent = a;
                b.onclick = () => checkAnswer(a, b);
                bubbleZone.appendChild(b);
            });
        }
        // END RENDER BUBBLES
        
        function checkAnswer(a,b){if(!awaitingAnswer)return;awaitingAnswer=!1;stopTimer();if(a==currentPair.right){score++;b.classList.add("correct");messageEl.textContent="Correct!"}else{b.classList.add("wrong");messageEl.textContent="Wrong!"}setTimeout(nextRound,800)}

        startBtn.onclick=startGame;
        resetBtn.onclick=resetGame;

        // ==========================================================
        // *** THIS IS THE CRITICAL FIX FOR CUSTOM FIELDS ***
        // ==========================================================
        
        /**
         * Toggles the visibility of a custom input field based on the associated
         * select dropdown's current value.
         */
        function toggleCustomInput(selectElement, customInputElement) {
            if (selectElement.value === "custom") {
                // Shows the input field
                customInputElement.style.display = 'inline-block';
            } else {
                // Hides the input field
                customInputElement.style.display = 'none';
            }
        }

        // 1. Attach event listeners to the three settings dropdowns
        timeSelect.addEventListener('change', () => toggleCustomInput(timeSelect, customTime));
        choiceSelect.addEventListener('change', () => toggleCustomInput(choiceSelect, customChoices));
        roundSelect.addEventListener('change', () => toggleCustomInput(roundSelect, customRounds));

        // 2. Run the check once immediately on page load
        // This ensures the fields are correctly hidden/shown if the browser remembers a previous selection.
        toggleCustomInput(timeSelect, customTime);
        toggleCustomInput(choiceSelect, customChoices);
        toggleCustomInput(roundSelect, customRounds);

        // ==========================================================
    </script>
